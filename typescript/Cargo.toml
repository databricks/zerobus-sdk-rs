[package]
name = "zerobus-sdk-ts"
version = "2.0.0"
authors = ["Databricks"]
edition = "2021"
license = "Apache-2.0"
description = "TypeScript/Node.js bindings for the Databricks Zerobus SDK"
repository = "https://github.com/databricks/zerobus-sdk"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "tokio_rt", "serde-json", "napi6"] }
napi-derive = "2"

# Local dev: depend on the in-tree Rust SDK 2.0.0. Replace with a crates.io
# version pin once 2.0.0 is published.
# The `testing` feature is enabled so we can expose `NoTlsConfig` to JS
# callers that need to hit a plaintext local endpoint.
databricks-zerobus-ingest-sdk = { path = "../rust/sdk", features = ["testing"] }

tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

prost = "0.14"
prost-types = "0.14"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

thiserror = "2"
base64 = "0.22"
async-trait = "0.1"
bytes = "1.11"

arrow-array = { version = "58.2", optional = true }
arrow-schema = { version = "58.2", optional = true }
arrow-ipc = { version = "58.2", features = ["lz4", "zstd"], optional = true }

[build-dependencies]
napi-build = "2"

[features]
default = []
# Arrow Flight is in Beta. The default npm build (`npm run build`) enables
# this feature — `cargo build --features arrow-flight` reproduces it
# directly. The bare `cargo check` / `cargo build` (no features) compiles
# the gRPC-only surface, useful for catching dead-code drift.
arrow-flight = [
    "databricks-zerobus-ingest-sdk/arrow-flight",
    "dep:arrow-array",
    "dep:arrow-schema",
    "dep:arrow-ipc"
]

[profile.release]
lto = true
strip = true
