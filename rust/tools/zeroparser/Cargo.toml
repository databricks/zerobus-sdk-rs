[workspace]
members = ["e2e"]
default-members = [".", "e2e"]
resolver = "2"

[package]
name = "zeroparser"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Zero-copy, single-pass protobuf parser driven by DescriptorProto."
repository = "https://github.com/databricks/Zeroparser"
keywords = ["protobuf", "parser", "zero-copy", "descriptor"]
categories = ["parser-implementations", "encoding"]
publish = false

[dependencies]
prost-types = "0.14"
self_cell = "1.2"

[dev-dependencies]
strum = { version = "0.27", features = ["derive"] }
