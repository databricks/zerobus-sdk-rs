[package]
name = "zerobus-jni"
version = "1.3.0"
authors = ["Databricks"]
edition = "2021"
rust-version = "1.70"
license = "Apache-2.0"
description = "JNI bindings for the Zerobus Rust SDK"
repository = "https://github.com/databricks/zerobus-sdk"
publish = false

[lib]
crate-type = ["cdylib"]
name = "zerobus_jni"

[dependencies]
databricks-zerobus-ingest-sdk = { path = "../sdk", version = "2.3.1", features = ["arrow-flight"] }
async-trait.workspace = true
jni.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Arrow dependencies (re-exported from SDK)
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc = { workspace = true, features = ["lz4", "zstd"] }

[features]
default = []
test-helpers = []
