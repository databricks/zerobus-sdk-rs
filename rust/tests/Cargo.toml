[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[[test]]
name = "rust_tests"
path = "src/rust_tests.rs"

[[test]]
name = "oauth_token_tests"
path = "src/oauth_token_tests.rs"

[[test]]
name = "proxy_tests"
path = "src/proxy_tests.rs"

[[test]]
name = "multiplexed_stream_tests"
path = "src/multiplexed_stream_tests.rs"

[[test]]
name = "persistent_stream_tests"
path = "src/persistent_stream_tests.rs"

[[test]]
name = "arrow_tests"
path = "src/arrow_tests.rs"

[[test]]
name = "arrow_c_data_ffi_tests"
path = "src/arrow_c_data_ffi_tests.rs"

[dependencies]
async-trait.workspace = true
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["tls-native-roots", "transport"] }
tonic-prost.workspace = true
tonic-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
databricks-zerobus-ingest-sdk = { path = "../sdk", features = ["testing", "test-hooks", "arrow-flight", "internal-arrow-c-data", "zeroparser", "eos"] }
zerobus-ffi = { path = "../ffi" }

# Arrow Flight test dependencies
arrow-flight.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
rcgen = "0.13"
# rcgen allows newer time releases that require Rust 1.88; keep tests compatible
# with the workspace's Rust 1.85 Arrow dependency floor.
time = "=0.3.36"
tempfile.workspace = true
tokio-rustls.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true
