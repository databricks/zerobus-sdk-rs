[package]
name = "tests"
version = "0.1.0"
edition = "2021"
publish = false

[[test]]
name = "rust_tests"
path = "src/rust_tests.rs"

[[test]]
name = "proxy_tests"
path = "src/proxy_tests.rs"

[[test]]
name = "multiplexed_stream_tests"
path = "src/multiplexed_stream_tests.rs"

[[test]]
name = "arrow_tests"
path = "src/arrow_tests.rs"

[[test]]
name = "token_cache_tests"
path = "src/token_cache_tests.rs"

[dependencies]
async-trait.workspace = true
prost.workspace = true
prost-reflect.workspace = true
prost-types.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true, features = ["tls-native-roots", "transport"] }
tonic-prost.workspace = true
tonic-types.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
databricks-zerobus-ingest-sdk = { path = "../sdk", features = ["testing", "test-hooks", "arrow-flight", "zeroparser"] }

# Arrow Flight test dependencies
arrow-flight.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
bytes.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protoc-bin-vendored.workspace = true
