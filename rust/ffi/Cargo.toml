[package]
name = "zerobus-ffi"
version = "1.6.0"
edition = "2021"
description = "C FFI bindings for the Zerobus Rust SDK"
license = "Apache-2.0"
publish = false

[lib]
# `rlib` is used only by workspace integration tests that call the real C ABI.
# Published FFI artifacts remain the static and dynamic libraries.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
databricks-zerobus-ingest-sdk = { path = "../sdk", version = "2.0.1", features = ["arrow-flight", "internal-arrow-c-data", "testing"] }

# Arrow IPC fallback plus schema and unacknowledged-batch serialization.
arrow-ipc.workspace = true

# FFI helpers
tokio = { workspace = true, features = ["rt", "rt-multi-thread"] }
once_cell.workspace = true
prost.workspace = true
prost-types.workspace = true
async-trait.workspace = true
bytes.workspace = true
libc.workspace = true

# Dynamic protobuf: build a descriptor pool from a UC-derived DescriptorProto
# and encode JSON records into protobuf bytes (UC schema -> proto path for
# pure-C consumers). serde_json parses the UC table metadata + record JSON.
prost-reflect = { workspace = true, features = ["serde"] }
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
arrow-array = { workspace = true, features = ["ffi"] }
arrow-schema = { workspace = true, features = ["ffi"] }

[build-dependencies]
cbindgen.workspace = true
