name: Release Rust
run-name: "Release Rust SDK ${{ github.ref_name }}"

on:
  push:
    tags:
      - "rust/v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: rust
    environment: crates-io

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io (Trusted Publishing)
        run: cargo publish -p databricks-zerobus-ingest-sdk

  release:
    name: Create GitHub Release
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    needs: publish

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/rust/v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        run: |
          version="v${{ steps.version.outputs.version }}"
          awk "/^## Release ${version}/{found=1; next} /^## /{if(found) exit} found{print}" rust/CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Rust SDK v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
