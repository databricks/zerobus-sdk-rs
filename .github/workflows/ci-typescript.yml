name: TypeScript CI

on:
  workflow_call:
    inputs:
      use_local_sdk:
        description: 'Override databricks-zerobus-ingest-sdk with the local path dep (for integration testing unreleased Rust changes)'
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: linux-ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: linux-ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - host: windows-server-latest
            target: x86_64-pc-windows-msvc

    name: Build - ${{ matrix.settings.target }}
    runs-on:
      group: databricks-protected-runner-group
      labels: ${{ matrix.settings.host }}
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install Rust (Unix)
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Add Rust target
        run: rustup target add ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            typescript/target/
          key: ${{ matrix.settings.target }}-cargo-${{ hashFiles('typescript/Cargo.lock') }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.settings.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Patch Cargo.toml to use local Rust SDK (Unix)
        if: inputs.use_local_sdk && runner.os != 'Windows'
        run: printf '\n[patch.crates-io]\ndatabricks-zerobus-ingest-sdk = { path = "../rust/sdk" }\n' >> Cargo.toml

      - name: Patch Cargo.toml to use local Rust SDK (Windows)
        if: inputs.use_local_sdk && runner.os == 'Windows'
        run: Add-Content -Path Cargo.toml -Value "`n[patch.crates-io]`ndatabricks-zerobus-ingest-sdk = { path = `"../rust/sdk`" }`n"
        shell: powershell

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --target ${{ matrix.settings.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: 'typescript/*.node'
          if-no-files-found: error

  test:
    name: Test Node.js ${{ matrix.node }} - ${{ matrix.os }}
    runs-on:
      group: databricks-protected-runner-group
      labels: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux-ubuntu-latest, windows-server-latest]
        node: ['16', '18', '20']
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: typescript/package-lock.json

      - name: Install Rust (Unix)
        if: runner.os != 'Windows'
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Rust (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          echo "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell

      - name: Patch Cargo.toml to use local Rust SDK (Unix)
        if: inputs.use_local_sdk && runner.os != 'Windows'
        run: printf '\n[patch.crates-io]\ndatabricks-zerobus-ingest-sdk = { path = "../rust/sdk" }\n' >> Cargo.toml

      - name: Patch Cargo.toml to use local Rust SDK (Windows)
        if: inputs.use_local_sdk && runner.os == 'Windows'
        run: Add-Content -Path Cargo.toml -Value "`n[patch.crates-io]`ndatabricks-zerobus-ingest-sdk = { path = `"../rust/sdk`" }`n"
        shell: powershell

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build:debug

      - name: Test
        run: npm run test:unit
