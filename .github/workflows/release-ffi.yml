name: Release FFI
run-name: "Release FFI ${{ github.ref_name }}"

on:
  push:
    tags:
      - "ffi/v*"

permissions:
  contents: write

jobs:
  build-ffi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            target: x86_64-unknown-linux-gnu
            static_lib: libzerobus_ffi.a
            dynamic_lib: libzerobus_ffi.so
            artifact_dir: linux-x86_64
            cross: false
          - runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            target: aarch64-unknown-linux-gnu
            static_lib: libzerobus_ffi.a
            dynamic_lib: libzerobus_ffi.so
            artifact_dir: linux-aarch64
            cross: true
          - runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            target: x86_64-pc-windows-msvc
            static_lib: zerobus_ffi.lib
            dynamic_lib: zerobus_ffi.dll
            artifact_dir: windows-x86_64
            cross: false
          - runner: [self-hosted, macOS, ARM64, zerobus-sdk]
            target: aarch64-apple-darwin
            static_lib: libzerobus_ffi.a
            dynamic_lib: libzerobus_ffi.dylib
            artifact_dir: macos-aarch64
            cross: false
          - runner: [self-hosted, macOS, ARM64, zerobus-sdk]
            target: x86_64-apple-darwin
            static_lib: libzerobus_ffi.a
            dynamic_lib: libzerobus_ffi.dylib
            artifact_dir: macos-x86_64
            cross: false

    name: Build FFI - ${{ matrix.artifact_dir }}
    runs-on: ${{ matrix.runner }}

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        uses: arduino/setup-protoc@v3

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          mkdir -p .cargo
          echo '[target.aarch64-unknown-linux-gnu]' > .cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> .cargo/config.toml

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build FFI library
        run: cargo build --release -p zerobus-ffi --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/${{ matrix.artifact_dir }}
          cp target/${{ matrix.target }}/release/${{ matrix.static_lib }} artifacts/${{ matrix.artifact_dir }}/
          cp target/${{ matrix.target }}/release/${{ matrix.dynamic_lib }} artifacts/${{ matrix.artifact_dir }}/
          cp ffi/zerobus.h artifacts/${{ matrix.artifact_dir }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffi-${{ matrix.artifact_dir }}
          path: rust/artifacts/${{ matrix.artifact_dir }}

  release:
    name: Create GitHub Release
    needs: build-ffi
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/ffi/v}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: native
          pattern: ffi-*
          merge-multiple: false

      - name: Create release archive
        run: |
          mkdir -p release
          for dir in native/ffi-*/; do
            platform=$(basename "$dir" | sed 's/ffi-//')
            mkdir -p "release/$platform"
            cp "$dir"/* "release/$platform/"
          done
          tar -czvf zerobus-ffi-${{ steps.version.outputs.version }}.tar.gz -C release .

      - name: Extract release notes from changelog
        run: |
          version="v${{ steps.version.outputs.version }}"
          awk "/^## Release ${version}/{found=1; next} /^## /{if(found) exit} found{print}" rust/ffi/CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FFI Libraries v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
          files: zerobus-ffi-${{ steps.version.outputs.version }}.tar.gz
