name: Release TypeScript
run-name: "Release TypeScript SDK ${{ github.ref_name }}"

on:
  push:
    tags:
      - "typescript/v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            target: x86_64-unknown-linux-gnu
          - runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            target: aarch64-unknown-linux-gnu
          - runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            target: x86_64-pc-windows-msvc
          - runner: [self-hosted, macOS, ARM64, zerobus-sdk]
            target: aarch64-apple-darwin
          - runner: [self-hosted, macOS, ARM64, zerobus-sdk]
            target: x86_64-apple-darwin

    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24


      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.target }}
          path: 'typescript/*.node'
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: typescript

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'


      - name: Install dependencies
        run: npm ci

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: typescript/artifacts

      - name: Move artifacts into place
        run: npx napi artifacts --artifacts-dir artifacts --output-dir .

      - name: List bindings
        run: ls -la *.node

      - name: Generate platform packages
        run: npx napi prepublish -t npm --skip-gh-release

      - name: Publish platform packages
        run: |
          for dir in npm/*/; do
            npm publish "$dir" --access public --provenance
          done

      - name: Publish main package
        run: npm publish --access public --provenance --ignore-scripts

  release:
    name: Create GitHub Release
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    needs: publish

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/typescript/v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        run: |
          version="v${{ steps.version.outputs.version }}"
          awk "/^## Release ${version}/{found=1; next} /^## /{if(found) exit} found{print}" typescript/CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          name: TypeScript SDK v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
