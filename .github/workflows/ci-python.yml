name: Python CI

on:
  workflow_call:
    inputs:
      use_local_sdk:
        description: 'Override databricks-zerobus-ingest-sdk with the local path dep (for integration testing unreleased Rust changes)'
        type: boolean
        default: false

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.9'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.10'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.11'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            pyVersion: '3.12'
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            pyVersion: '3.12'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure pip registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-pip.sh"
      - name: Unshallow
        run: git fetch --prune --unshallow || true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.pyVersion }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Copy root LICENSE for maturin
        shell: bash
        run: cp ../LICENSE LICENSE

      # - name: Patch Cargo.toml to use local Rust SDK
      #   if: inputs.use_local_sdk
      #   working-directory: python/rust
      #   shell: bash
      #   run: |
      #     printf '\n[patch.crates-io]\ndatabricks-zerobus-ingest-sdk = { path = "../../rust/sdk" }\n' >> Cargo.toml

      - name: Run tests (Linux)
        if: runner.os != 'Windows'
        run: make dev test

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -m venv .venv
          .venv/Scripts/python -m pip install --upgrade pip
          test -f LICENSE || cp ../LICENSE LICENSE
          .venv/Scripts/python -m pip install -r requirements-dev.lock
          .venv/Scripts/python -m maturin develop
          .venv/Scripts/python -m pytest --cov=zerobus --cov-report html --cov-report xml tests

  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure pip registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-pip.sh"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt

      - name: Copy root LICENSE for maturin
        run: cp ../LICENSE LICENSE

      - name: Format all files
        run: make dev fmt

      - name: Fail on differences
        run: git diff --exit-code

  lint:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Cargo registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-cargo.sh"
      - name: Configure pip registry
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/configure-pip.sh"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Copy root LICENSE for maturin
        run: cp ../LICENSE LICENSE

      - name: Lint code
        run: make dev lint