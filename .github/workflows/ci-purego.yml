name: PureGo CI

# CI for the pure-Go SDK module (purego/). Unlike the cgo-based go/ module, this
# one links no Rust FFI, so it needs no Cargo/Rust toolchain — just Go. The test
# job runs under the race detector because the transport layer is concurrency
# sensitive (single-writer send, separate recv goroutine, and a supervisor that
# will reassign the stream ID on recovery).

on:
  workflow_call:

jobs:
  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purego
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      # gofmt needs no module downloads, so no registry configuration here.
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  vet:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purego
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Vet
        run: go vet ./...

  test:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: purego
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Get JFrog OIDC token
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/jfrog-oidc-token.sh"
      - name: Configure Go registry
        shell: bash
        run: |
          echo "GOPROXY=https://databricks.jfrog.io/artifactory/api/go/db-golang,direct" >> "$GITHUB_ENV"
          echo "GONOSUMDB=*" >> "$GITHUB_ENV"
          cat > ~/.netrc << EOF
          machine databricks.jfrog.io
          login gha-service-account
          password ${JFROG_ACCESS_TOKEN}
          EOF
          chmod 600 ~/.netrc
          echo "Go configured to use JFrog registry"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      # `-race` needs CGO and a C compiler (the detector's requirement, not the
      # SDK's) — both on the Linux runner. It instruments Go code, so this run
      # covers data races regardless of target OS; no Windows entry needed.
      - name: Run tests (race detector)
        run: go test -race ./...

      - name: Run tests (CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go test ./...
