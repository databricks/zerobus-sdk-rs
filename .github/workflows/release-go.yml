name: Release Go
run-name: "Release Go SDK ${{ github.ref_name }}"

on:
  push:
    tags:
      - "go/v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/go/v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from changelog
        run: |
          version="v${{ steps.version.outputs.version }}"
          awk "/^## Release ${version}/{found=1; next} /^## /{if(found) exit} found{print}" go/CHANGELOG.md > /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          name: Go SDK v${{ steps.version.outputs.version }}
          body_path: /tmp/release-notes.md
