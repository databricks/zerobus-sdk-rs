name: Java CI

on:
  workflow_call:
    inputs:
      use_local_sdk:
        description: 'Override databricks-zerobus-ingest-sdk with the local path dep (for integration testing unreleased Rust changes)'
        type: boolean
        default: false
      artifact_suffix:
        description: 'Suffix to append to artifact names to avoid conflicts when called multiple times in one workflow run'
        type: string
        default: ''

jobs:
  fmt:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Set up JDK 11
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: 11
          distribution: 'temurin'
          cache: 'maven'
      - name: Check formatting
        run: mvn spotless:check
      - name: Fail on formatting differences
        if: failure()
        run: |
          echo "Code formatting issues detected. Run 'mvn spotless:apply' to fix."
          exit 1

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            javaVersion: '11'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            javaVersion: '17'
          - os: linux-ubuntu-latest
            runner: { group: databricks-protected-runner-group, labels: linux-ubuntu-latest }
            javaVersion: '21'
          - os: windows-server-latest
            runner: { group: databricks-protected-runner-group, labels: windows-server-latest }
            javaVersion: '11'
          - os: macos-arm64
            runner: [self-hosted, macOS, ARM64, zerobus-sdk]
            javaVersion: '11'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Unshallow
        run: git fetch --prune --unshallow || true
      - name: Set up JDK ${{ matrix.javaVersion }}
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: ${{ matrix.javaVersion }}
          distribution: 'temurin'
          cache: 'maven'
      - name: Patch Rust workspace to use local SDK
        if: inputs.use_local_sdk
        shell: bash
        run: printf '\n[patch.crates-io]\ndatabricks-zerobus-ingest-sdk = { path = "sdk" }\n' >> ../rust/Cargo.toml
      - name: Install Maven (macOS)
        if: runner.os == 'macOS'
        run: brew install maven 2>/dev/null || true
      - name: Build with Maven
        run: mvn clean compile
      - name: Run tests
        run: mvn test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.os }}-java-${{ matrix.javaVersion }}${{ inputs.artifact_suffix }}
          path: |
            java/target/surefire-reports/
            java/target/test-classes/
          retention-days: 7
