name: All SDK Integration Tests
run-name: "All SDK tests on ${{ github.ref_name }} by @${{ github.actor }}"

# Manual trigger only — requires write access to the repository.
# Use this when changing Rust core to verify no SDK is broken before releasing
# a new FFI version. Each SDK's test job builds the Rust FFI from source so
# you are always testing against the current branch.
#
# For stricter admin-only enforcement, create a GitHub environment named
# "sdk-integration" with required reviewers and uncomment the `environment:`
# lines in each job below.
on:
  workflow_dispatch:

jobs:
  rust:
    uses: ./.github/workflows/ci-rust.yml

  go:
    uses: ./.github/workflows/ci-go.yml
    # environment: sdk-integration

  python:
    uses: ./.github/workflows/ci-python.yml
    with:
      use_local_sdk: true
    # environment: sdk-integration

  java:
    uses: ./.github/workflows/ci-java.yml
    # environment: sdk-integration

  typescript:
    uses: ./.github/workflows/ci-typescript.yml
    with:
      use_local_sdk: true
    # environment: sdk-integration

  gate:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    needs: [rust, go, python, java, typescript]
    if: always()
    steps:
      - name: Check all SDKs passed
        run: |
          results=(
            "rust=${{ needs.rust.result }}"
            "go=${{ needs.go.result }}"
            "python=${{ needs.python.result }}"
            "java=${{ needs.java.result }}"
            "typescript=${{ needs.typescript.result }}"
          )
          failed=()
          for r in "${results[@]}"; do
            name="${r%%=*}"
            result="${r##*=}"
            if [[ "$result" == "failure" ]]; then
              failed+=("$name")
            fi
          done
          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "Failed SDKs: ${failed[*]}"
            exit 1
          fi
          echo "All SDKs passed"
