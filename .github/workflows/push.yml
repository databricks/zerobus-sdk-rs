name: CI

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  gate:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    needs: [changes, rust, java, typescript, python, go]
    if: always()
    steps:
      - run: |
          for result in \
            "${{ needs.rust.result }}" \
            "${{ needs.java.result }}" \
            "${{ needs.typescript.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.go.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job failed or was cancelled: $result"
              exit 1
            fi
          done

  changes:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      java: ${{ steps.filter.outputs.java }}
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/ci-rust.yml'
            java:
              - 'java/**'
              - '.github/workflows/ci-java.yml'
            typescript:
              - 'typescript/**'
              - '.github/workflows/ci-typescript.yml'
            python:
              - 'python/**'
              - '.github/workflows/ci-python.yml'
            go:
              - 'go/**'
              - '.github/workflows/ci-go.yml'

  # Blocking jobs — required for merge
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-rust.yml

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-java.yml

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-typescript.yml

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-python.yml

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-go.yml

  # Non-blocking cross-SDK jobs — run all SDK tests against the local Rust
  # source when rust/** changes, to catch breakage before a new FFI release.
  # These are intentionally excluded from `gate` so they don't block merging.
  cross-sdk-go:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-go.yml
    with:
      use_local_sdk: true

  cross-sdk-python:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-python.yml
    with:
      use_local_sdk: true

  cross-sdk-typescript:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-typescript.yml
    with:
      use_local_sdk: true
      artifact_suffix: '-local-sdk'

  cross-sdk-java:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/ci-java.yml
    with:
      use_local_sdk: true
      artifact_suffix: '-local-sdk'