name: CI

on:
  pull_request:
    types: [opened, synchronize]
  merge_group:
    types: [checks_requested]

jobs:
  gate:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    needs: [changes, rust, java, typescript, python, go]
    if: always()
    steps:
      - run: |
          if [[ "${{ needs.rust.result }}" == "failure" ]] || \
             [[ "${{ needs.java.result }}" == "failure" ]] || \
             [[ "${{ needs.typescript.result }}" == "failure" ]] || \
             [[ "${{ needs.python.result }}" == "failure" ]] || \
             [[ "${{ needs.go.result }}" == "failure" ]]; then
            exit 1
          fi

  changes:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      java: ${{ steps.filter.outputs.java }}
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - '.github/workflows/ci-rust.yml'
            java:
              - 'java/**'
              - '.github/workflows/ci-java.yml'
            typescript:
              - 'typescript/**'
              - 'rust/**'
              - '.github/workflows/ci-typescript.yml'
            python:
              - 'python/**'
              - 'rust/**'
              - '.github/workflows/ci-python.yml'
            go:
              - 'go/**'
              - 'rust/**'
              - '.github/workflows/ci-go.yml'

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    uses: ./.github/workflows/ci-rust.yml

  java:
    needs: changes
    if: needs.changes.outputs.java == 'true'
    uses: ./.github/workflows/ci-java.yml

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true'
    uses: ./.github/workflows/ci-typescript.yml
    with:
      use_local_sdk: ${{ needs.changes.outputs.rust == 'true' }}

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: ./.github/workflows/ci-python.yml
    with:
      use_local_sdk: ${{ needs.changes.outputs.rust == 'true' }}

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/ci-go.yml
  