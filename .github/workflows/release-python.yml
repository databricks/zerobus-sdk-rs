name: Build Python
run-name: "Build Python SDK ${{ github.ref_name }}"

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'

      - name: Copy root LICENSE for maturin
        run: cp LICENSE python/LICENSE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install maturin
        run: pip install maturin==1.8.3

      - name: Build wheels (x86_64)
        if: matrix.target == 'x86_64'
        run: maturin build --release --manifest-path python/rust/Cargo.toml --out dist

      - name: Install Zig (for aarch64)
        if: matrix.target == 'aarch64'
        run: |
          wget -q https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz
          echo "d45dc85249209f4ae438e863c576af25c089a1442e4b8e3bd51b1d59e0d93ab0  zig-linux-x86_64-0.13.0.tar.xz" | sha256sum -c -
          tar -xf zig-linux-x86_64-0.13.0.tar.xz
          echo "$(pwd)/zig-linux-x86_64-0.13.0" >> $GITHUB_PATH

      - name: Build wheels (aarch64)
        if: matrix.target == 'aarch64'
        run: |
          source "$HOME/.cargo/env"
          rustup target add aarch64-unknown-linux-gnu
          cargo install cargo-zigbuild@0.22.1
          maturin build --release --target aarch64-unknown-linux-gnu --zig --manifest-path python/rust/Cargo.toml --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  build-windows:
    runs-on:
      group: databricks-protected-runner-group
      labels: windows-server-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'

      - name: Copy root LICENSE for maturin
        run: cp LICENSE python/LICENSE
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install maturin
        run: pip install maturin==1.8.3

      - name: Build wheels
        run: maturin build --release --manifest-path python/rust/Cargo.toml --out dist
        shell: bash

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-windows
          path: dist
          if-no-files-found: error

  sdist:
    runs-on:
      group: databricks-protected-runner-group
      labels: linux-ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.9'

      - name: Copy root LICENSE for maturin
        run: cp LICENSE python/LICENSE

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install maturin
        run: pip install maturin==1.8.3

      - name: Build source distribution
        run: maturin sdist --manifest-path python/rust/Cargo.toml --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error
