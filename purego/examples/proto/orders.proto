// Protobuf schema for the example `orders` table:
//
//	orders(id INT, customer_name STRING, product_name STRING, quantity INT,
//	       price DOUBLE, status STRING, created_at TIMESTAMP, updated_at TIMESTAMP)
//
// Field numbers map to the table's column ordinals (1-based, declaration order).
// proto2 is used so nullable columns can be `optional` (proto3 has no explicit
// presence for scalars). INT -> int32, STRING -> string, DOUBLE -> double,
// TIMESTAMP -> int64 microseconds since the Unix epoch (UTC).
//
// The pure-Go SDK has no runtime Unity Catalog metadata → descriptor builder
// (the C++ ProtoSchema::from_uc_json path), so the proto examples use this
// static schema: the generated bindings live in pb/, and the descriptor is
// marshaled from them at runtime. This is a HAND-MAINTAINED copy of the table's
// shape — keep it in sync with the table or records land in the wrong columns.

syntax = "proto2";

package zerobus_examples;

option go_package = "github.com/databricks/zerobus-sdk/purego/examples/proto/pb";

message Order {
  optional int32 id = 1;
  optional string customer_name = 2;
  optional string product_name = 3;
  optional int32 quantity = 4;
  optional double price = 5;
  optional string status = 6;
  optional int64 created_at = 7;
  optional int64 updated_at = 8;
}
