[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "databricks-zerobus-ingest-sdk"
dynamic = ["version"]
description = "Databricks Zerobus Ingest SDK for Python"
readme = "README.md"
requires-python = ">=3.9,<3.15"
keywords = ["zerobus", "databricks", "sdk"]
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "protobuf>=4.25.0,<7.0",
    "requests>=2.28.1,<3",
]

[project.optional-dependencies]
arrow = [
    # pyarrow dropped CPython 3.9 before it added CPython 3.14, so no single
    # version covers the range this SDK supports. 21.0.0 is the last release with
    # 3.9 wheels; 22.0.0 is the first with 3.14 wheels. Keep the two branches
    # split by marker, otherwise one end of the matrix cannot install.
    "pyarrow>=14.0.0,<22.0; python_version < '3.14'",
    "pyarrow>=22.0.0,<26.0; python_version >= '3.14'",
]
dev = [
    # Build tools
    "wheel",
    "build",
    "grpcio-tools>=1.60.0,<2.0",
    "pip-tools>=7.0,<8",
    # Code formatting
    "black",
    "pycodestyle",
    "autoflake",
    "isort",
    # Testing
    "pytest",
    "pytest-cov",
    "pytest-xdist>=3.6.1,<4.0",
    "pytest-asyncio>=0.21,<1.0",
    "pyarrow>=14.0.0,<22.0; python_version < '3.14'",
    "pyarrow>=22.0.0,<26.0; python_version >= '3.14'",
]

[tool.maturin]
python-source = "."
module-name = "zerobus._zerobus_core"
features = ["pyo3/extension-module"]
include = [{path = "NOTICE", format = "sdist"}]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312', 'py313', 'py314']

[tool.isort]
profile = "black"
line_length = 120
