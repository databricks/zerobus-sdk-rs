[package]
name = "zerobus-python"
version = "1.3.0"
edition = "2021"

[lib]
name = "_zerobus_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py39"] }
pyo3-asyncio = { version = "0.20", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
databricks-zerobus-ingest-sdk = { version = "2.0.1", features = ["arrow-flight"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
prost = "0.14"
prost-types = "0.14"
tonic = "0.14"
arrow-ipc = { version = "58.2", default-features = false }
arrow-schema = { version = "58.2", default-features = false }
arrow-array = { version = "58.2", default-features = false }

# Override arrow-flight (pulled in transitively via databricks-zerobus-ingest-sdk's
# arrow-flight feature) with the vendored copy carrying the slice-aware batch-split
# fix (arrow-rs#9388 / #5352). The wheel is built from this manifest, so the patch
# must live here too. See rust/third_party/arrow-flight.
[patch.crates-io]
arrow-flight = { path = "../../rust/third_party/arrow-flight" }
